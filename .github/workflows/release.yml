# When you publish a release on GitHub, this zips the extension and attaches it,
# so people can download and install @me without cloning the repo.
name: Attach extension zip to release
on:
  release:
    types: [published]
permissions:
  contents: write
jobs:
  package:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Zip the extension
        run: |
          if grep -q "PASTE_YOUR_CLIENT_ID" extension/manifest.json; then
            echo "::warning::extension/manifest.json still has the placeholder client ID, so Google sign-in won't work in this release."
          fi
          cp -r extension atme-extension
          rm -f atme-extension/README.md
          zip -r "atme-extension-${{ github.event.release.tag_name }}.zip" atme-extension -x "*.DS_Store"
      - name: Upload to the release
        env:
          GH_TOKEN: ${{ github.token }}
        # The versioned file, plus a fixed name so .../releases/latest/download/atme-extension.zip always works.
        run: |
          cp "atme-extension-${{ github.event.release.tag_name }}.zip" atme-extension.zip
          gh release upload "${{ github.event.release.tag_name }}" "atme-extension-${{ github.event.release.tag_name }}.zip" atme-extension.zip --clobber
